<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTSU - 3D Technology Summer Institute - 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      overflow: hidden;
      color: white
    }

    #header {
      position: absolute;
      top: 5px;
      left: 5px;
      background: transparent;
    }

    canvas {
      display: block;
    }

    #error-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      color: #ff5555;
      font-family: monospace;
      font-size: 14px;
      padding: 2rem;
      z-index: 9999;
      white-space: pre-wrap;
      overflow: auto;
    }

    #error-overlay.visible {
      display: block;
    }

    #error-overlay h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #ff8888;
    }

    #currentSourceLine {
      font-family: monospace;
      font-weight: bold;
      display: block;
      padding: 20px;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BGDQGSyb.js"></script>
</head>

<body>
  <div id="header">
    <h1>My Project</h1>
    <div id="timeDisplay" style="display: none;">
      Time: <span id="timeText">TIME</span> s

            padding: 20px;

  <button

  <button

            ">

  <button

            padding: 20px;

            color: black;
            font-weight: bold;
            font-size: large;
            position: absolute;
            bottom: 50px;

            ">

  </button>

  <button
    id="5"

            padding: 20px;
            background: white;
            color: black;

            font-size: large;
            position: absolute;
            bottom: 50px;

  <button
    id="+"
    style="
            padding: 20px;
            background: white;

            font-weight: bold;
            font-size: large;
            position: absolute;
            bottom: 300px;
            left: 150px
            ">
    +
  </button>

  <button
    id="-"
    style="
            padding: 20px;
            background: white;
            color: black;
            font-weight: bold;
            font-size: large;
            position: absolute;
            bottom: 300px;
            left: 100px
            ">
    -
  </button>

  <script>
    function showError(msg) {
      document.getElementById("error-message").textContent = msg;
      document.getElementById("error-overlay").classList.add("visible");
    }

    // Catch runtime errors (e.g. typos inside draw())
    window.onerror = (msg, src, line, col) => {
      showError(`${msg}\n\n${src}\n\nat line ${line}, column ${col}`);
    };

    // Catch unhandled promise rejections
    window.onunhandledrejection = (e) => {
      showError(e.reason?.stack || String(e.reason));
    };
  </script>



</body>

</html>
